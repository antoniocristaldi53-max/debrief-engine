  "Ann Gastroenterol Surg": 3
  "BMC Surg": 3
  "Am Surg": 3
  "ANZ J Surg": 3
  "Ann R Coll Surg Engl": 3
  "Can J Surg": 3
  "J Robot Surg": 3
  "J Laparoendosc Adv Surg Tech A": 3

# Query di recupero (identiche al prompt, per confrontabilità col connettore)
