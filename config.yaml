  # 16/11/2026: allargamento del recupero. Dal 09/11 parete e proctologia escono vuote a 28 giorni
  # e colon-retto/eso-gastrico/HPB arrivano al tetto dei 14 giorni: il pool delle 35 riviste
  # non regge un'edizione quotidiana. Riviste chirurgiche indicizzate, verificate su E-utilities
  # (sigla MedlineTA e prefisso DOI). Tier 3 salvo le due di società di riferimento.
  "J Hepatobiliary Pancreat Sci": 2   # JSHBPS, HPB
  "Surg Obes Relat Dis": 2            # ASMBS, bariatrica
  "Ann Surg Treat Res": 3             # era tier 1: rivista coreana di medio impatto, errore di tier
  "J Abdom Wall Surg": 3              # European Hernia Society
